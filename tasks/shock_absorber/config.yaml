    fov_degrees: 73.96
    near: 0.01
    far: 10.0
  wrist_camera:
    position:
    - 0.0616
    - -0.0008
    - 0.0
    quaternion:
    - 0.70710678
    - 0.0
    - -0.70710678
    - 0.0
    fov_degrees: 70.0
    near: 0.01
    far: 3.0
objects:
  module: shock_absorber
  board_center_xy: [0.008, 0.536]
  board_position_offset_xy:
  - [-0.02, 0.02]
  - [-0.02, 0.02]
  board_yaw_range_degrees: [-5.0, 5.0]
  module_cell_positions_xy:
  - [0.0, 0.0]
  peg_cell_positions_xy:
  - [0.0, 0.086603]
  - [0.075, 0.043301]
  - [0.075, -0.043301]
  - [0.0, -0.086603]
  - [-0.075, -0.043301]
  - [-0.075, 0.043301]
  module_yaw_choices_degrees: [0.0, 60.0, 120.0, 180.0, 240.0, 300.0]
  board_color: [1.0, 1.0, 1.0]
  board_surface_height: 0.005
  hollow_cells: true
  support_color: [1.0, 0.78, 0.0]
  part_color: [0.0, 0.1294118, 0.8745098]
shock_absorber:
  axis_height: 0.031          # spring axis, so the 15 mm spring clears the plates by 1 mm
  washer_radius: 0.008
  washer_z: [0.0254, 0.029]   # from the screw shoulder to the clamped eye
  nut_z: 0.037                # bottom of the M8 nut, on top of the clamped eye
  nut_color: [0.0, 0.1294118, 0.8745098]
  clamped_eye_mm: [2.0, 0.0, -10.16]
  free_eye_mm: [0.0, 0.0, 72.16]
  segments: [Corpo3_seg0, Corpo3_seg1, Corpo3_seg2, Corpo3_seg3, Corpo3_seg4]
  mass: 0.05                  # whole part, shared among the segments by volume
  spring_stiffness: 100.0     # N/m of the whole coil (each of the four joints in series is four times stiffer)
  spring_damping: 2.0         # N s/m of the whole coil
  spring_range: [-0.010, 0.015]   # compression and extension of the whole coil, m
  swing_friction: 0.0
  swing_damping: 0.02
  lift_friction: 0.0
  lift_damping: 0.01
  max_lift_degrees: 25.0
  start_offset_choices_degrees: [-120.0, -60.0, 60.0, 120.0, 180.0]
  free_eye_collision: {inner_radius: 4.85, outer_radius: 7.5, half_thickness: 3.96, boxes: 8}
  contact_offset: 0.003       # of the shock absorber's collision shapes (the scene's is 2 cm)
  peg_top: 0.038              # peg tip above the plate bottom
  peg_radius: 0.0025
  peg_holes_xy:
  - [0.0, -0.00038]
  - [0.02497, -0.00038]
  - [0.00002, 0.02852]
  - [-0.03502, -0.00038]
  - [-0.01433, -0.029]
  reachable_spring_change: [-0.009, 0.012]
success:
  insert_radius: 0.004
  insert_height: 0.003
  linear_velocity: 0.02
  angular_velocity: 0.1
  contact_force: 0.2
  hold_steps: 10
randomization:
  robot_init_qpos_noise: 0.0
  real_start_qpos: true
  min_radius: 0.3
  max_radius: 0.7
  x_range: [-0.45, 0.45]
  y_range: [0.175, 0.775]
demo:
  max_speed: 0.12
  contact_speed: 0.04
  max_angular_speed: 0.6
  approach_height: 0.08
  grip_height: 0.002
  open_width: 0.02
  settle_steps: 4
  eye_half_height: 0.004
  peg_clearance: 0.005
  swing_step_degrees: 15.0
  aim_passes: 6
  aim_tolerance: 0.0015
distractors:
  clearance: 0.04
  cubes: {enabled: false, count: 0, half_size: 0.02, colors: [green]}
  ood_objects: {enabled: false, count: 0, shapes: [bar], colors: [white]}
  wrong_zones: {enabled: false, count: 0, half_size: 0.05, colors: [green]}
prompt:
  randomize: false
  templates:
  - lift the free end of the blue shock absorber and fit its eye over the yellow peg
